[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynadio-slicer"
version = "1.0.0"
description = "DynaDio Slicer - air-pump gel printer slicer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "DynaDio" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.44"]

[project.scripts]
dynadio = "dynadio_cli.main:main"
dynadio-api = "dynadio_api.__main__:main"

[tool.setuptools]
package-dir = { "dynadio_core" = "core/dynadio_core", "dynadio_cli" = "cli/dynadio_cli", "dynadio_api" = "api/dynadio_api" }
packages = ["dynadio_core", "dynadio_cli", "dynadio_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that slice large models",
    "ui: Playwright interface tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"
